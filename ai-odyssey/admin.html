<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CRISIS LAB | Debug the Arena</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/cyberpunk.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
    <div class="cyber-bg">
        <div class="grid-overlay"></div>
        <div class="scan-line"></div>
        <div class="particles" id="particles"></div>
    </div>

    <nav class="navbar glass" id="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">⌘</span>
                <span class="brand-text">CRISIS LAB</span>
                <span class="brand-sub">DEBUG THE ARENA</span>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">Home</a>
                <a href="rules.html" class="nav-link">Rules</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="scoreboard.html" class="nav-link">Scoreboard</a>
                <a href="admin.html" class="nav-link active">Admin</a>
            </div>
            <div class="nav-controls">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="toggle-icon">🌙</span>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="admin-page">
        <div class="admin-container">
            <div class="admin-header">
                <h1>⚙️ Admin Panel</h1>
                <div class="timer-display" id="timerDisplay">⏱ 90:00</div>
            </div>

            <div class="admin-grid">
                <div class="admin-card glass">
                    <h3>⏱️ Timer Controls</h3>
                    <div class="admin-actions">
                        <button class="admin-btn success" onclick="document.dispatchEvent(new CustomEvent('timer:start'))">▶ Start Timer</button>
                        <button class="admin-btn" onclick="document.dispatchEvent(new CustomEvent('timer:stop'))">⏸ Pause Timer</button>
                        <button class="admin-btn danger" onclick="document.dispatchEvent(new CustomEvent('timer:reset'))">↺ Reset Timer</button>
                    </div>
                </div>

                <div class="admin-card glass">
                    <h3>📊 Event Controls</h3>
                    <div class="admin-actions">
                        <button class="admin-btn" onclick="App.exportLeaderboard()">📥 Export Leaderboard</button>
                        <button class="admin-btn danger" id="resetEvent">🗑️ Reset Event</button>
                    </div>
                </div>
            </div>

            <div class="admin-card glass">
                <h3>📋 Challenge Management</h3>
                <div class="admin-challenge-list" id="adminChallengeList">
                    <!-- Rendered by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/particles.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/timer.js"></script>
    <script src="assets/js/challenges.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
