<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CRISIS LAB | Debug the Arena</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/cyberpunk.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
    <div class="cyber-bg">
        <div class="grid-overlay"></div>
        <div class="scan-line"></div>
        <div class="particles" id="particles"></div>
    </div>

    <nav class="navbar glass" id="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">⌘</span>
                <span class="brand-text">CRISIS LAB</span>
                <span class="brand-sub">DEBUG THE ARENA</span>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">Home</a>
                <a href="rules.html" class="nav-link">Rules</a>
                <a href="register.html" class="nav-link">Register</a>
                <a href="login.html" class="nav-link active">Login</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="scoreboard.html" class="nav-link">Scoreboard</a>
            </div>
            <div class="nav-controls">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="toggle-icon">🌙</span>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="login-page">
        <div class="login-container">
            <div class="login-card glass">
                <div class="login-header">
                    <span class="brand-icon">⌘</span>
                    <h1>Enter the Arena</h1>
                    <p>Sign in to start debugging</p>
                </div>

<div class="login-tabs">
                    <button class="login-tab active" data-tab="login">Sign In</button>
                    <button class="login-tab" data-tab="register">Register</button>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" class="form-input" placeholder="Enter your username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary glow">
                        <span>🚀 Enter Arena</span>
                    </button>
                </form>

                <form class="login-form" id="registerForm" style="display:none;">
                    <div class="form-group">
                        <label class="form-label" for="registerUsername">Username</label>
                        <input type="text" id="registerUsername" class="form-input" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerTeamName">Team Name</label>
                        <input type="text" id="registerTeamName" class="form-input" placeholder="Enter your team name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" class="form-input" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="btn btn-secondary">
                        <span>➕ Register Team</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/particles.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/challenges.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/login-supabase.js"></script>
</body>
</html>
