<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard - CRISIS LAB | Debug the Arena</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/cyberpunk.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
    <div class="cyber-bg">
        <div class="grid-overlay"></div>
        <div class="scan-line"></div>
        <div class="particles" id="particles"></div>
    </div>

    <nav class="navbar glass" id="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">⌘</span>
                <span class="brand-text">CRISIS LAB</span>
                <span class="brand-sub">DEBUG THE ARENA</span>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">Home</a>
                <a href="rules.html" class="nav-link">Rules</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="scoreboard.html" class="nav-link active">Scoreboard</a>
            </div>
            <div class="nav-controls">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="toggle-icon">🌙</span>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="scoreboard-page">
        <div class="scoreboard-container">
            <div class="scoreboard-header">
                <h1>🏆 Leaderboard</h1>
                <p>Live rankings of all competing teams</p>
            </div>

            <div class="scoreboard-controls">
                <input type="text" id="scoreboardSearch" class="scoreboard-search" placeholder="🔍 Search team name...">
                <div class="timer-display" id="timerDisplay">⏱ 90:00</div>
            </div>

            <div class="table-container glass" style="overflow-x: auto; padding: 0;">
                <table class="scoreboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Team Name</th>
                            <th>Solved</th>
                            <th>Easy</th>
                            <th>Medium</th>
                            <th>Hard</th>
                            <th>Total Points</th>
                            <th>Last Solve</th>
                            <th>Badges</th>
                        </tr>
                    </thead>
                    <tbody id="scoreboardBody">
                        <!-- Rows rendered by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/particles.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/timer.js"></script>
    <script src="assets/js/challenges.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/scoreboard-supabase.js"></script>
</body>
</html>
